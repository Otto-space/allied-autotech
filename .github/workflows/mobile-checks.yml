name: Mobile scaffold checks
on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-checks.yml"
      - "backend/docs/api/allied-autotech.openapi.json"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-checks.yml"
      - "backend/docs/api/allied-autotech.openapi.json"
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/mobile/tools/api-codegen/package-lock.json
      - run: npm ci
      - name: Install isolated OpenAPI generator
        run: npm ci --prefix tools/api-codegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api/contracts/generated.d.ts
