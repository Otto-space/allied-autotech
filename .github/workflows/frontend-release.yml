name: Frontend release checks

on:
  push:
    paths:
      - "frontend/**"
      - "package.json"
      - "AGENTS.md"
      - ".github/workflows/frontend-release.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "AGENTS.md"
      - ".github/workflows/frontend-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Offline build validation only; these placeholders never contact a real API.
      BACKEND_ORIGIN: https://api.example.com
      SITE_ORIGIN: https://www.example.com
      SITE_INDEXING: disabled
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_HELP_LEARN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:production
