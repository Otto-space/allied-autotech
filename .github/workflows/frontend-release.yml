name: Frontend release checks

on:
  push:
    paths:
      - "frontend/**"
      - "package.json"
      - "AGENTS.md"
      - ".github/workflows/frontend-release.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "AGENTS.md"
      - ".github/workflows/frontend-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # One production build, followed by the existing Chromium suite and the
    # bounded Firefox/WebKit responsive matrix. The fixture API is serial.
    # The exact 984-case serial matrix reached 865 passes in 30 minutes on
    # dab976c7 before the step timeout, with no assertion failures. Keep every
    # test and allow setup, the bounded full matrix and evidence upload.
    timeout-minutes: 55
    defaults:
      run:
        working-directory: frontend
    env:
      # Offline build validation only; these placeholders never contact a real API.
      BACKEND_ORIGIN: https://api.example.com
      SITE_ORIGIN: https://www.example.com
      SITE_INDEXING: disabled
      NEXT_TELEMETRY_DISABLED: "1"
      # Exercise hosted image URL behaviour without any production identifier.
      NEXT_DEPLOYMENT_ID: isolated-media-acceptance
      NEXT_PUBLIC_HELP_LEARN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:production
      - name: Install the three engines used by the isolated regression
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Record browser engine versions and test platform
        run: |
          node --input-type=module <<'NODE'
          import { chromium, firefox, webkit } from 'playwright';
          for (const engine of [chromium, firefox, webkit]) {
            const browser = await engine.launch();
            try {
              console.log(JSON.stringify({ engine: engine.name(), version: browser.version(), platform: process.platform, physicalDevice: false }));
            } finally {
              await browser.close();
            }
          }
          NODE
      - name: Verify WebKit calendar and search transport before the full matrix
        run: npx --no-install playwright test booking-calendar.spec.ts public-search-recovery.spec.ts --config playwright.runtime.config.ts --project=responsive-webkit --grep "calendar 320x720|public search recovery" --repeat-each=3 --max-failures=1
      - name: Verify exact media URLs and image decoding before the full matrix
        timeout-minutes: 5
        run: npx --no-install playwright test --config playwright.runtime.config.ts --project=media-contract-chromium --project=media-contract-firefox --project=media-contract-webkit --max-failures=1
      - name: Verify order sourcing review and recovery before the full matrix
        timeout-minutes: 3
        run: npx --no-install playwright test order-timing.spec.ts order-pickup.spec.ts order-supply-concerns.spec.ts --config playwright.runtime.config.ts --project=runtime --max-failures=1
      - name: Verify independent runtime availability in the production build
        # Run every case with unchanged per-test limits and assertions.
        # The measured serial run needs more than 30 minutes. A step timeout
        # leaves the job alive to upload its synthetic evidence.
        timeout-minutes: 40
        run: npx --no-install playwright test --config playwright.runtime.config.ts --max-failures=5
      - name: Preserve synthetic browser evidence
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v5
        with:
          name: runtime-capabilities-browser
          path: frontend/test-results/runtime-capabilities/
          retention-days: 7
          if-no-files-found: ignore
