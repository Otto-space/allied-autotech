name: Redacted repository secret guard

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scan_history:
        description: Also audit available history (known old Resend exposure must fail until cleaned)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:secrets
      - if: ${{ inputs.scan_history == true }}
        run: npm run check:secrets:history
