name: Backend database safety

on:
  push:
    paths:
      [
        "backend/**",
        "AGENTS.md",
        ".github/workflows/backend-database-safety.yml",
      ]
  pull_request:
    paths:
      [
        "backend/**",
        "AGENTS.md",
        ".github/workflows/backend-database-safety.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only-password
          POSTGRES_DB: allied_autotech_schema_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: allied_autotech_schema_ci
      DB_USER: postgres
      DB_PASSWORD: isolated-ci-only-password
      DB_SSL_MODE: disable
      CONFIRM_EMPTY_MIGRATION_DATABASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Replay migrations and reject missing schema migrations
        run: npm run test:migrations
      - run: npm run db:check
      - run: npm run typecheck
      - run: npm run check:scripts
      - run: npm run lint
      - name: Verify backup, command and startup protection
        run: npx --no-install vitest run tests/unit/database-schema-safety.test.ts tests/unit/database-migration-safety.test.ts tests/unit/database-health.test.ts tests/unit/database-error-mapping.test.ts --maxWorkers=2
      - name: Verify unknown service durations and public workshop guidance
        run: npx --no-install vitest run tests/unit/service-duration.test.ts tests/unit/public-service-copy.test.ts tests/unit/phase5-service-operations-security.test.ts tests/unit/catalogue-learning.test.ts tests/unit/promotion-rounding.test.ts tests/unit/order-money-allocation.test.ts tests/unit/openapi-handover.test.ts tests/unit/owner-policy-money.test.ts tests/unit/quotation-terms.test.ts tests/unit/vehicle-operator-migration.test.ts tests/unit/vehicle-operations-learning.test.ts --maxWorkers=1
      - name: Verify booking and financial review with isolated runtime privileges
        env:
          DB_NAME: allied_booking_acceptance_ci
          TEST_DB_NAME: allied_booking_acceptance_ci
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=postgres allied_booking_acceptance_ci
          npm run test:migrations
          npm run db:check
          docker exec -i "${{ job.services.postgres.id }}" psql --username=postgres --dbname=allied_booking_acceptance_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE allied_booking_runtime_ci LOGIN PASSWORD 'isolated-ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CONNECT ON DATABASE allied_booking_acceptance_ci TO allied_booking_runtime_ci;
          GRANT USAGE ON SCHEMA public TO allied_booking_runtime_ci;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO allied_booking_runtime_ci;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO allied_booking_runtime_ci;
          REVOKE ALL ON TABLE "_prisma_migrations" FROM allied_booking_runtime_ci;
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'allied_booking_runtime_ci' AND (rolsuper OR rolcreatedb OR rolcreaterole))
              OR has_schema_privilege('allied_booking_runtime_ci', 'public', 'CREATE')
              OR has_database_privilege('allied_booking_runtime_ci', 'allied_booking_acceptance_ci', 'CREATE')
              OR has_table_privilege('allied_booking_runtime_ci', 'public."Booking"', 'TRUNCATE')
              OR has_table_privilege('allied_booking_runtime_ci', 'public."_prisma_migrations"', 'SELECT')
            THEN RAISE EXCEPTION 'Booking CI runtime privileges exceed the allowed scope'; END IF;
          END $$;
          SQL
          # This worker claims the global due queue. Run its concurrency proof
          # before lifecycle fixtures add reminders under declared synthetic clocks.
          run_booking_tests() {
            docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_booking_acceptance_ci -e TEST_DB_NAME=allied_booking_acceptance_ci \
            -e DB_USER=allied_booking_runtime_ci -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run "$@" --maxWorkers=1
          }
          run_booking_tests tests/integration/booking-reminder-concurrency.test.ts
          run_booking_tests \
            tests/unit/booking-timing.test.ts tests/unit/booking-slot-timing.test.ts \
            tests/unit/workshop-resources.test.ts tests/integration/workshop-resource-policy.test.ts \
            tests/integration/workshop-resource-options.test.ts tests/unit/isolated-resource-database.test.ts \
            tests/unit/booking-reminder-window.test.ts tests/unit/workshop-resource-learning.test.ts \
            tests/integration/workforce-aftercare.test.ts \
            tests/integration/booking-resource-lifecycle.test.ts \
            tests/unit/booking-reschedule-notifications.test.ts tests/unit/booking-reschedule-learning.test.ts \
            tests/unit/catalogue-learning.test.ts tests/integration/booking-reschedule-approval.test.ts \
            tests/integration/workforce-booking-reschedule.test.ts tests/integration/booking-timing.test.ts \
            tests/integration/booking-slot-timing.test.ts tests/integration/owner-booking-policy.test.ts \
            tests/integration/workforce-booking-confirmation.test.ts tests/integration/workforce-bookings.test.ts \
            tests/integration/booking-response.test.ts \
            tests/integration/booking-settlement-race.test.ts tests/integration/concern-booking-journey.test.ts
      - name: Verify administrator authoring on the new isolated CI database
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/admin-service-catalogue.test.ts tests/integration/service-discovery.test.ts --maxWorkers=1
      - name: Verify pre-payment review evidence on isolated PostgreSQL
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/unit/purchase-review.test.ts tests/unit/purchase-offer-view.test.ts tests/unit/fitment-engine.test.ts tests/unit/owner-transaction-retry.test.ts tests/integration/purchase-review.test.ts --maxWorkers=1
      - name: Verify isolated guest purchase access without customer-account access
        env:
          DB_NAME: allied_purchase_guest_access_ci
          TEST_DB_NAME: allied_purchase_guest_access_ci
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=postgres allied_purchase_guest_access_ci
          npm run test:migrations
          npm run db:check
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_purchase_guest_access_ci -e TEST_DB_NAME=allied_purchase_guest_access_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/purchase-guest-access.test.ts tests/integration/purchase-guest-ownership.test.ts tests/integration/purchase-guest-checkout.test.ts tests/integration/purchase-guest-payments.test.ts tests/integration/purchase-guest-http.test.ts tests/integration/purchase-guest-quotes.test.ts tests/integration/purchase-guest-documents.test.ts tests/integration/purchase-guest-aftercare.test.ts --maxWorkers=1
      - name: Verify administrator vehicle operations on a separate fresh database
        env:
          DB_NAME: allied_vehicle_operator_ci
          TEST_DB_NAME: allied_vehicle_operator_ci
        run: |
          PGPASSWORD="$DB_PASSWORD" createdb --host=localhost --port=5432 --username=postgres allied_vehicle_operator_ci
          npm run test:migrations
          npm run db:check
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_vehicle_operator_ci -e TEST_DB_NAME=allied_vehicle_operator_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/vehicle-operator-access.test.ts --maxWorkers=1
      - name: Verify Admin operations and retained owner controls on fresh isolated data
        env:
          DB_NAME: allied_admin_operations_regression_ci
          TEST_DB_NAME: allied_admin_operations_regression_ci
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=postgres allied_admin_operations_regression_ci
          npm run test:migrations
          npm run db:check
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            --mount "type=bind,source=$PWD/../frontend/lib/workforce-registry.ts,target=/frontend/lib/workforce-registry.ts,readonly" \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_admin_operations_regression_ci -e TEST_DB_NAME=allied_admin_operations_regression_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/workforce-access.test.ts tests/integration/workforce-session-policy.test.ts \
            tests/integration/workforce-role-transition.test.ts tests/integration/workforce-directory.test.ts --maxWorkers=1
      - name: Prove missing-column protection against isolated PostgreSQL
        env:
          TEST_DB_NAME: allied_autotech_schema_ci
          RUN_DATABASE_TESTS: "true"
          RUN_DATABASE_SAFETY_TESTS: "true"
        run: npx --no-install vitest run tests/integration/database-schema-safety.test.ts --maxWorkers=1
      - name: Verify unlisted public parts enquiries against isolated PostgreSQL
        env:
          TEST_DB_NAME: allied_autotech_schema_ci
          RUN_DATABASE_TESTS: "true"
        run: npx --no-install vitest run tests/integration/public-unlisted-parts-enquiry.test.ts tests/unit/public-parts-enquiry.test.ts --maxWorkers=1
      - name: Verify contextual service requests and parts quotation orders
        env:
          TEST_DB_NAME: allied_autotech_schema_ci
          RUN_DATABASE_TESTS: "true"
          PUBLIC_LAUNCH_MODE: full
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e PUBLIC_LAUNCH_MODE=full -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/service-group-enquiry.test.ts tests/integration/parts-quotation-journey.test.ts --maxWorkers=1
      - name: Verify catalogue search, product families and vehicle enquiry routing
        env:
          TEST_DB_NAME: allied_autotech_schema_ci
          RUN_DATABASE_TESTS: "true"
        run: npx --no-install vitest run tests/integration/vehicle-requirements-enquiry.test.ts tests/integration/vehicle-owner-disclosures.test.ts tests/unit/vehicle-disclosure-learning.test.ts tests/integration/product-families.test.ts tests/integration/product-options.test.ts tests/integration/catalogue-search-r2.test.ts tests/integration/product-discovery.test.ts tests/integration/vehicle-discovery.test.ts tests/unit/vehicle-enquiry-intent.test.ts tests/unit/product-family-contract.test.ts --maxWorkers=2
      - name: Verify current-session manual payment review and concurrent decisions
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/manual-review-concurrency.test.ts \
            tests/unit/manual-payment-session-boundary.test.ts --maxWorkers=1
      - name: Verify manual refund approval and processing on isolated PostgreSQL
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/refund-processing.test.ts \
            tests/integration/dispute-workflow.test.ts --maxWorkers=1
      - name: Verify reconciliation queue, backfill and retries on isolated PostgreSQL
