name: Backend database safety

on:
  push:
    paths:
      [
        "backend/**",
        "AGENTS.md",
        ".github/workflows/backend-database-safety.yml",
      ]
  pull_request:
    paths:
      [
        "backend/**",
        "AGENTS.md",
        ".github/workflows/backend-database-safety.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only-password
          POSTGRES_DB: allied_autotech_schema_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: allied_autotech_schema_ci
      DB_USER: postgres
      DB_PASSWORD: isolated-ci-only-password
      DB_SSL_MODE: disable
      CONFIRM_EMPTY_MIGRATION_DATABASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Replay migrations and reject missing schema migrations
        run: npm run test:migrations
      - run: npm run db:check
      - run: npm run typecheck
      - run: npm run check:scripts
      - run: npm run lint
      - name: Verify backup, command and startup protection
        run: npx --no-install vitest run tests/unit/database-schema-safety.test.ts tests/unit/database-migration-safety.test.ts tests/unit/database-health.test.ts tests/unit/database-error-mapping.test.ts --maxWorkers=2
      - name: Prove missing-column protection against isolated PostgreSQL
        env:
          TEST_DB_NAME: allied_autotech_schema_ci
          RUN_DATABASE_TESTS: "true"
          RUN_DATABASE_SAFETY_TESTS: "true"
        run: npx --no-install vitest run tests/integration/database-schema-safety.test.ts --maxWorkers=1
      - name: Verify unlisted public parts enquiries against isolated PostgreSQL
        env:
          TEST_DB_NAME: allied_autotech_schema_ci
          RUN_DATABASE_TESTS: "true"
        run: npx --no-install vitest run tests/integration/public-unlisted-parts-enquiry.test.ts tests/unit/public-parts-enquiry.test.ts --maxWorkers=1
      - name: Verify catalogue search, product families and vehicle enquiry routing
        env:
          TEST_DB_NAME: allied_autotech_schema_ci
          RUN_DATABASE_TESTS: "true"
        run: npx --no-install vitest run tests/integration/vehicle-requirements-enquiry.test.ts tests/integration/product-families.test.ts tests/integration/product-options.test.ts tests/integration/catalogue-search-r2.test.ts tests/integration/product-discovery.test.ts tests/integration/vehicle-discovery.test.ts tests/unit/vehicle-enquiry-intent.test.ts tests/unit/product-family-contract.test.ts --maxWorkers=2
      - name: Verify current-session manual payment review and concurrent decisions
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/manual-review-concurrency.test.ts \
            tests/unit/manual-payment-session-boundary.test.ts --maxWorkers=1
      - name: Verify manual refund approval and processing on isolated PostgreSQL
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/refund-processing.test.ts --maxWorkers=1
      - name: Verify current-session refund requests and approvals
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/phase8-payment-flow.test.ts \
            tests/integration/monnify-payment-flow.test.ts \
            tests/unit/refund-request-session-boundary.test.ts \
            tests/unit/refund-approval-atomicity.test.ts --maxWorkers=1
      - name: Verify customer account controls and scoped Customer Care on exact loopback target
        # Share the disposable service's network namespace. The exact-target helper
        # then verifies PostgreSQL's actual loopback host/port, without trusting a
        # forwarded Docker address or weakening the local fixture safety guard.
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true -e RUN_SUPPORT_TIMELINE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/customers-care.test.ts tests/integration/customer-directory.test.ts \
            tests/integration/support-customer-email.test.ts tests/integration/support-timeline.test.ts \
            tests/integration/identity-flow.test.ts --maxWorkers=2
      - name: Verify eligible learning and practice definitions on isolated PostgreSQL
        run: |
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            -e NODE_ENV=test -e DEPLOYMENT_ENV=local -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=allied_autotech_schema_ci -e TEST_DB_NAME=allied_autotech_schema_ci \
            -e DB_USER=postgres -e DB_PASSWORD=isolated-ci-only-password -e DB_SSL_MODE=disable \
            -e CONFIRM_EMPTY_MIGRATION_DATABASE=true -e RUN_DATABASE_TESTS=true \
            -e EMAIL_DELIVERY_ENABLED=false -e SMS_DELIVERY_ENABLED=false \
            -e HELP_LEARN_ENABLED=true -e HELP_LEARN_GUIDES_ENABLED=true -e HELP_LEARN_PRACTICE_ENABLED=true \
            node:24.13.0 node node_modules/vitest/vitest.mjs run \
            tests/integration/learning.test.ts --maxWorkers=1
